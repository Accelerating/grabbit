[project]
name = "grabbit-backend"
version = "0.1.0"
description = "Grabbit offline download manager backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.16.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.116.0",
    "pydantic-settings>=2.10.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.41",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
]

[project.scripts]
grabbit = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
